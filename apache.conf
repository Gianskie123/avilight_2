<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    DirectoryIndex login.php index.php

    # ─────────────────────────────────────────
    # Main PHP application
    # ─────────────────────────────────────────
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ─────────────────────────────────────────
    # PHP file handling
    # ─────────────────────────────────────────
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # ─────────────────────────────────────────
    # Proxy: /python-api/* → FastAPI on port 8000
    # PHP calls this via: http://localhost/python-api/predict etc.
    # ─────────────────────────────────────────
    ProxyPreserveHost On
    ProxyPass        /python-api/ http://127.0.0.1:8000/
    ProxyPassReverse /python-api/ http://127.0.0.1:8000/

    # ─────────────────────────────────────────
    # Security: block direct access to sensitive dirs
    # ─────────────────────────────────────────
    <DirectoryMatch "^/var/www/html/(secrets|\.env)">
        Require all denied
    </DirectoryMatch>

    # ─────────────────────────────────────────
    # Increase upload limits for model zip files
    # ─────────────────────────────────────────
    LimitRequestBody 524288000

    # ─────────────────────────────────────────
    # Logs
    # ─────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/avilight_error.log
    CustomLog ${APACHE_LOG_DIR}/avilight_access.log combined
</VirtualHost>
